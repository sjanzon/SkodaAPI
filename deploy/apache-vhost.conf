# Apache virtual host, e.g. /etc/apache2/sites-available/skoda.conf
# Enable with: a2ensite skoda && systemctl reload apache2
<VirtualHost *:80>
    ServerName skoda.example.com
    DocumentRoot /var/www/skoda/public

    <Directory /var/www/skoda/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Restrict access, e.g. to the local network – the page can control the vehicle
        # Require ip 192.168.0.0/16
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/skoda_error.log
    CustomLog ${APACHE_LOG_DIR}/skoda_access.log combined
</VirtualHost>
