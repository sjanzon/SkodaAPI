# nginx server block with PHP-FPM, e.g. /etc/nginx/sites-available/skoda
# Enable with: ln -s ../sites-available/skoda /etc/nginx/sites-enabled/ && systemctl reload nginx
server {
    listen 80;
    server_name skoda.example.com;

    # Only public/ is served – config files, src/ and var/ stay outside
    root /var/www/skoda/public;
    index index.php;

    # Restrict access, e.g. to the local network – the page can control the vehicle
    # allow 192.168.0.0/16;
    # deny all;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Adjust to the installed PHP version
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }
}
